<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journals of a Ministry Student</title>
    <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Bitter:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #e6dfd3;
            background-image: radial-gradient(circle at 50% 50%, #eae3d7 0%, #ded5c5 100%);
            font-family: 'Lora', serif;
            color: #1a1612;
            padding: 30px 40px;
            min-height: 100vh;
        }
        
        .newspaper-container {
            width: 100%;
            max-width: 1550px;
            margin: 0 auto;
            border: 1px solid #1a1612;
            padding: 30px 40px;
            background: transparent;
        }

        /* Masthead Layout */
        header.masthead-top {
            text-align: center;
            border-bottom: 2px solid #1a1612;
            padding-bottom: 12px;
        }

        h1.masthead-title {
            font-family: 'Old Standard TT', 'Playfair Display', serif;
            font-size: 76px;
            font-weight: 700;
            color: #1a1612;
            line-height: 1.0;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        /* Issue Bar / Date Line */
        .issue-bar {
            border-top: 1px solid #1a1612;
            border-bottom: 3px double #1a1612;
            padding: 6px 10px;
            margin: 12px 0 28px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Bitter', serif;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Section Banner */
        .section-banner {
            border-top: 2px solid #1a1612;
            border-bottom: 1px solid #1a1612;
            text-align: center;
            padding: 6px 0;
            margin-bottom: 30px;
        }

        .section-banner h2 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* 3-Column Flex Grid with Asymmetric Column Widths */
        .main-newspaper-grid {
            display: flex;
            gap: 30px;
            margin-bottom: 40px;
        }

        .col-1 {
            flex: 1.35;
            display: flex;
            flex-direction: column;
            gap: 28px;
            border-right: 1px solid #1a1612;
            padding-right: 30px;
        }

        .col-2 {
            flex: 1.0;
            display: flex;
            flex-direction: column;
            gap: 28px;
            border-right: 1px solid #1a1612;
            padding-right: 30px;
        }

        .col-3 {
            flex: 1.15;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* Publisher's Notice Box */
        .publisher-notice {
            border: 2px solid #1a1612;
            padding: 22px;
            position: relative;
            background: rgba(0,0,0,0.015);
        }

        .publisher-notice::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid #1a1612;
            pointer-events: none;
        }

        .notice-header {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            border-bottom: 1px solid #1a1612;
            padding-bottom: 6px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .notice-body {
            font-size: 14px;
            line-height: 1.65;
            text-align: justify;
            color: #261f18;
        }

        /* Story Cards */
        .story-card {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            border: 1px solid #1a1612;
            padding: 22px;
            background: rgba(253, 251, 247, 0.4);
            position: relative;
            transition: all 0.2s ease;
            box-shadow: 2px 2px 0px #1a1612;
        }

        .story-card:hover {
            background: #fdfbf7;
            transform: translateY(-3px);
            box-shadow: 4px 4px 0px #1a1612;
        }

        .story-kicker {
            font-family: 'Bitter', serif;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #594839;
            margin-bottom: 6px;
        }

        .story-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .story-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 900;
            line-height: 1.25;
            margin-bottom: 10px;
        }

        .story-text {
            font-size: 14px;
            line-height: 1.65;
            text-align: justify;
            color: #2b231b;
            margin-bottom: 16px;
            flex-grow: 1;
        }

        .dropcap::first-letter {
            font-family: 'Playfair Display', serif;
            font-size: 44px;
            float: left;
            line-height: 0.8;
            padding-top: 3px;
            padding-right: 7px;
            font-weight: 900;
        }

        .story-meta {
            font-family: 'Bitter', serif;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            color: #594839;
            border-top: 1px solid #1a1612;
            padding-top: 8px;
            margin-top: auto;
        }

        /* Author Section */
        .author-section {
            border-top: 3px double #1a1612;
            padding-top: 30px;
            margin-top: 20px;
        }

        .bio-container {
            border: 1px solid #1a1612;
            padding: 25px;
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .bio-photos {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-shrink: 0;
            width: 300px;
        }

        .retro-frame {
            background: #fdfbf7;
            padding: 8px 8px 28px 8px;
            border: 1px solid #1a1612;
            width: 140px;
            text-align: center;
            box-shadow: 3px 3px 0px #1a1612;
            transition: transform 0.2s ease;
        }

        .retro-frame:hover {
            transform: scale(1.05);
            z-index: 5;
        }

        .vintage-photo {
            width: 100%;
            height: 135px;
            object-fit: cover;
            object-position: bottom;
            border: 1px solid #1a1612;
            filter: sepia(0.42) contrast(1.12) brightness(0.93) grayscale(0.2);
        }

        .bio-details h3 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .bio-details .byline {
            font-family: 'Bitter', serif;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #594839;
            font-weight: 700;
            margin-bottom: 12px;
            border-bottom: 1px solid #1a1612;
            padding-bottom: 6px;
        }

        .bio-details p {
            font-size: 14px;
            line-height: 1.65;
            text-align: justify;
            margin-bottom: 10px;
        }
