        * {
            margin: 0;

            box-sizing: border-box;

            font-family: 'Lora', serif;
            color: #1a1612;
            padding: 30px 40px;
            min-height: 100vh;
        }
        
        .newspaper-container {
            width: 100%;
            max-width: 1550px;
            margin: 0 auto;
            border: 1px solid #1a1612;
            padding: 30px 40px;
            background: transparent;
        }

        /* Masthead Layout */
        header.masthead-top {
            text-align: center;
            border-bottom: 2px solid #1a1612;
            padding-bottom: 12px;
        }

        h1.masthead-title {
            font-family: 'Old Standard TT', 'Playfair Display', serif;
            font-size: 76px;
            font-weight: 700;
            color: #1a1612;
            line-height: 1.0;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        /* Issue Bar / Date Line */
        .issue-bar {
            border-top: 1px solid #1a1612;
            border-bottom: 3px double #1a1612;
            padding: 6px 10px;
            margin: 12px 0 28px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Bitter', serif;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Section Banner */
        .section-banner {
            border-top: 2px solid #1a1612;
            border-bottom: 1px solid #1a1612;
            text-align: center;
            padding: 6px 0;
            margin-bottom: 30px;
        }

        .section-banner h2 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Main Grid Structure */
        .main-newspaper-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 35px;
            margin-bottom: 40px;
        }

        .newspaper-col {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .newspaper-col.border-right {
            border-right: 1px solid #1a1612;
            padding-right: 35px;
        }

        /* Publisher's Notice / Explanation Box */
        .publisher-notice {
            border: 2px solid #1a1612;
            padding: 22px;
            position: relative;
            background: rgba(0,0,0,0.015);
        }

        .publisher-notice::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid #1a1612;
            pointer-events: none;
        }

        .notice-header {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            border-bottom: 1px solid #1a1612;
            padding-bottom: 6px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .notice-body {
            font-size: 14px;
            line-height: 1.65;
            text-align: justify;
            color: #261f18;
        }

        .story-card {
            text-decoration: none;
            color: inherit;
            display: flex;

            position: relative;
            transition: all 0.2s ease;
            box-shadow: 2px 2px 0px #1a1612;
        }
